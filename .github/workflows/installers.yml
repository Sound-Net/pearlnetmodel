# Builds the Windows and macOS installers on GitHub's runners (push a tag like v1.0.0, or run manually).
name: installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-13]   # macos-latest = Apple silicon, macos-13 = Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Build installer
        run: mvn -B -Pinstaller package
      - uses: actions/upload-artifact@v4
        with:
          name: SphereTS-${{ matrix.os }}
          path: java/target/installer/*
